<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة | المركز السامي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182635;
    --teal:#0F4C81;
    --teal-2:#1868AA;
    --teal-soft:#E4EEF7;
    --sand:#F8FAFC;
    --sand-2:#EEF2F5;
    --amber:#2E8B57;
    --amber-soft:#DFF3E7;
    --white:#FFFFFF;
    --red:#B0402A;
    --green:#2E8B57;
    --line:rgba(15,76,129,0.14);
    --shadow: 0 20px 50px -25px rgba(15,76,129,0.35);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--sand);color:var(--ink);font-family:'Tajawal',sans-serif;line-height:1.7;}
  h1,h2,h3,h4{font-family:'Cairo',sans-serif;color:var(--teal);margin:0;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px;}

  /* login */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:36px 32px;width:100%;max-width:380px;box-shadow:var(--shadow);}
  .login-box h1{font-size:22px;margin-bottom:6px;text-align:center;}
  .login-box p{text-align:center;color:#5c6b66;font-size:13.5px;margin:0 0 24px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-family:'Cairo',sans-serif;font-size:13.5px;font-weight:600;margin-bottom:7px;color:var(--teal);}
  .field input, .field select{
    width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
    font-family:'Tajawal',sans-serif;font-size:14.5px;background:var(--sand);color:var(--ink);outline:none;
  }
  .field input:focus{border-color:var(--amber);}
  .btn{font-family:'Cairo',sans-serif;font-weight:700;font-size:14.5px;padding:12px 22px;border-radius:12px;border:none;cursor:pointer;}
  .btn-primary{background:var(--amber);color:#fff;width:100%;}
  .btn-outline{background:transparent;color:var(--teal);border:1.5px solid var(--teal);}
  .btn-danger{background:#fdeceb;color:var(--red);}
  .login-error{color:var(--red);font-size:13px;margin-top:12px;display:none;text-align:center;}

  /* dashboard */
  #dashboard{display:none;}
  header.admin-head{background:var(--teal);color:#fff;padding:18px 0;position:sticky;top:0;z-index:10;}
  header.admin-head .wrap{display:flex;align-items:center;justify-content:space-between;}
  header.admin-head h1{color:#fff;font-size:19px;}
  .tabs{display:flex;gap:10px;margin:26px 0 20px;flex-wrap:wrap;}
  .tab-btn{font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;padding:10px 20px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;color:var(--teal);}
  .tab-btn.active{background:var(--teal);color:#fff;border-color:var(--teal);}
  .panel{display:none;padding-bottom:60px;}
  .panel.active{display:block;}

  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:14px;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
  .card-top h3{font-size:16.5px;}
  .card-top .meta{font-size:12.5px;color:#8a8f8b;}
  .status-badge{font-family:'Cairo',sans-serif;font-weight:700;font-size:12px;padding:5px 12px;border-radius:999px;background:var(--teal-soft);color:var(--teal);}
  .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 18px;margin-bottom:14px;font-size:13.5px;}
  .kv div b{display:block;font-family:'Cairo',sans-serif;font-size:12px;color:#8a8f8b;font-weight:600;margin-bottom:2px;}
  .desc-box{background:var(--sand);border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:14px;}
  .card-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .card-actions select{padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);font-family:'Tajawal',sans-serif;font-size:13px;background:var(--sand);}
  .stars{color:var(--amber);letter-spacing:2px;margin-bottom:8px;}
  .empty-state{text-align:center;padding:60px 20px;color:#8a8f8b;}
  .loading{text-align:center;padding:40px;color:#8a8f8b;font-family:'Cairo',sans-serif;}
  .search-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .search-row input, .search-row select{padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);font-family:'Tajawal',sans-serif;font-size:14px;background:#fff;}
  .search-row input{flex:1;min-width:200px;}

  /* dashboard stats */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:24px 0 4px;}
  .stat-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;text-align:center;}
  .stat-card .stat-value{font-family:'Cairo',sans-serif;font-weight:800;font-size:26px;color:var(--teal);}
  .stat-card.stat-new .stat-value{color:var(--red);}
  .stat-card .stat-label{font-size:12px;color:#8a8f8b;margin-top:4px;}
  .stat-card.stat-revenue{background:#EAF6EE;border-color:#8fc79f;}
  .stat-card.stat-revenue .stat-value{color:#1f6b3a;}
  .stat-mini-filter{margin-top:8px;font-size:11.5px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;font-family:'Tajawal',sans-serif;}

  /* whatsapp button */
  .btn-whatsapp{background:#25D366;color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-family:'Cairo',sans-serif;font-weight:700;font-size:13.5px;padding:8px 16px;border-radius:10px;}

  /* admin note */
  .note-box{background:#FFF8E8;border:1px dashed #d9b45c;border-radius:10px;padding:10px 12px;margin-bottom:14px;}
  .note-box label{display:block;font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;color:#8a6d1f;margin-bottom:6px;}
  .note-box textarea, .note-box input{width:100%;min-height:50px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:'Tajawal',sans-serif;font-size:13px;resize:vertical;margin-bottom:8px;background:#fff;}
  .note-box input{min-height:auto;}
  .btn-save-note{background:var(--teal-soft);color:var(--teal);font-family:'Cairo',sans-serif;font-weight:700;font-size:12.5px;padding:7px 14px;border-radius:9px;border:none;cursor:pointer;}
  .field-display{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .field-display .field-text{flex:1;font-size:13.5px;word-break:break-word;}
  .icon-btn{background:none;border:none;cursor:pointer;font-size:15px;padding:4px 7px;border-radius:7px;line-height:1;}
  .icon-btn:hover{background:rgba(0,0,0,0.07);}
  .price-box{background:#EAF6EE;border-color:#8fc79f;}
  .price-box label{color:#1f6b3a;}
  .price-box .btn-save-note{background:var(--amber-soft);color:var(--amber);}

  /* review moderation */
  .badge-pending{background:#FDF3DC;color:#8a6d1f;}
  .btn-approve{background:var(--amber-soft);color:var(--amber);}
  .btn-hide{background:#F1E4D8;color:#8a5a2b;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>لوحة إدارة المركز السامي</h1>
    <p>سجّلي دخول بحساب الأدمن اللي اتعمل في Supabase</p>
    <form id="loginForm">
      <div class="field"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" required></div>
      <div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password" required></div>
      <button type="submit" class="btn btn-primary">دخول</button>
      <p class="login-error" id="loginError">بيانات الدخول غلط، حاولي تاني.</p>
    </form>
  </div>
</div>

<div id="dashboard">
  <header class="admin-head">
    <div class="wrap">
      <h1>لوحة إدارة المركز السامي</h1>
      <button class="btn btn-outline" id="logoutBtn" style="background:transparent;color:#fff;border-color:rgba(255,255,255,0.5);">تسجيل خروج</button>
    </div>
  </header>

  <div class="wrap">
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-value" id="statToday">0</div>
        <div class="stat-label">حجوزات النهاردة</div>
      </div>
      <div class="stat-card stat-new">
        <div class="stat-value" id="statNew">0</div>
        <div class="stat-label">حجوزات "جديد" محتاجة رد</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statAvgRating">–</div>
        <div class="stat-label">متوسط تقييم المرضى</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statReviews">0</div>
        <div class="stat-label">عدد التعليقات</div>
      </div>
      <div class="stat-card stat-revenue">
        <div class="stat-value" id="statRevenue">0</div>
        <div class="stat-label">إجمالي الإيرادات (جنيه)</div>
        <select id="revenueFilter" class="stat-mini-filter">
          <option value="all">كل الوقت</option>
          <option value="week">آخر أسبوع</option>
          <option value="month">آخر شهر</option>
        </select>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="bookings">طلبات الحجز</button>
      <button class="tab-btn" data-tab="reviews">تقييمات المرضى</button>
    </div>

    <!-- BOOKINGS -->
    <div class="panel active" id="panel-bookings">
      <div class="search-row">
        <input type="text" id="bookingSearch" placeholder="دوّري بالاسم أو رقم التليفون...">
        <select id="statusFilter">
          <option value="">كل الحالات</option>
          <option value="جديد">جديد</option>
          <option value="تم التواصل">تم التواصل</option>
          <option value="تم الحجز">تم الحجز</option>
          <option value="ملغي">ملغي</option>
        </select>
        <select id="dateFilter">
          <option value="">كل الفترات</option>
          <option value="today">النهاردة</option>
          <option value="week">الأسبوع ده</option>
          <option value="month">الشهر ده</option>
        </select>
        <button class="btn btn-outline" id="exportExcelBtn" type="button">تصدير Excel</button>
      </div>
      <div id="bookingsList"><div class="loading">جاري التحميل...</div></div>
    </div>

    <!-- REVIEWS -->
    <div class="panel" id="panel-reviews">
      <div class="search-row">
        <input type="text" id="reviewSearch" placeholder="دوّري بالاسم أو نص التعليق...">
        <select id="reviewApprovalFilter">
          <option value="">كل التعليقات</option>
          <option value="pending">بانتظار المراجعة</option>
          <option value="approved">منشور</option>
        </select>
      </div>
      <div id="reviewsList"><div class="loading">جاري التحميل...</div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
  const SUPABASE_URL = "https://nkxkracyaljpkmeyurle.supabase.co";
  const SUPABASE_KEY = "sb_publishable_3g2IbfQh3SoramhkGwcF9g_fDg42sWO";
  const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const loginScreen = document.getElementById('loginScreen');
  const dashboard = document.getElementById('dashboard');
  const loginForm = document.getElementById('loginForm');
  const loginError = document.getElementById('loginError');

  let allBookings = [];
  let allReviews = [];

  async function checkSession(){
    const { data } = await supa.auth.getSession();
    if(data && data.session){
      showDashboard();
    }else{
      loginScreen.style.display = 'flex';
      dashboard.style.display = 'none';
    }
  }

  function showDashboard(){
    loginScreen.style.display = 'none';
    dashboard.style.display = 'block';
    loadBookings();
    loadReviews();
  }

  loginForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    loginError.style.display = 'none';
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const { error } = await supa.auth.signInWithPassword({ email, password });
    if(error){
      loginError.style.display = 'block';
      return;
    }
    showDashboard();
  });

  document.getElementById('logoutBtn').addEventListener('click', async ()=>{
    await supa.auth.signOut();
    loginScreen.style.display = 'flex';
    dashboard.style.display = 'none';
  });

  // ---------- tabs ----------
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }
  function fmtDate(v){
    if(!v) return '';
    const d = typeof v === 'number' ? new Date(v) : new Date(v);
    if(isNaN(d.getTime())) return '';
    return d.toLocaleString('ar-EG', { dateStyle:'medium', timeStyle:'short' });
  }

  // تجهيز رقم التليفون كرابط واتساب (بيفترض رقم مصري لو مفيش كود دولة)
  function toWhatsAppLink(phone){
    if(!phone) return '';
    let p = String(phone).replace(/[^0-9]/g, '');
    if(!p) return '';
    if(p.startsWith('0')) p = '20' + p.slice(1);
    else if(!p.startsWith('20')) p = '20' + p;
    return `https://wa.me/${p}`;
  }

  // فلترة الحجوزات حسب الفترة الزمنية
  function inDateRange(dateStr, range){
    if(!range) return true;
    const d = new Date(dateStr);
    if(isNaN(d.getTime())) return false;
    const now = new Date();
    if(range === 'today') return d.toDateString() === now.toDateString();
    if(range === 'week'){
      const start = new Date(now);
      start.setDate(now.getDate() - now.getDay());
      start.setHours(0,0,0,0);
      return d >= start;
    }
    if(range === 'month') return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    return true;
  }

  function filterBookings(){
    const q = document.getElementById('bookingSearch').value.trim().toLowerCase();
    const statusQ = document.getElementById('statusFilter').value;
    const dateQ = document.getElementById('dateFilter').value;
    return allBookings.filter(b=>{
      const matchQ = !q || (b.name||'').toLowerCase().includes(q) || (b.phone||'').toLowerCase().includes(q);
      const matchStatus = !statusQ || b.status === statusQ;
      const matchDate = inDateRange(b.created_at, dateQ);
      return matchQ && matchStatus && matchDate;
    });
  }

  // نطاق زمني لحساب الإيرادات (آخر 7 أو 30 يوم)
  function inRevenueRange(dateStr, range){
    if(!range || range === 'all') return true;
    const d = new Date(dateStr);
    if(isNaN(d.getTime())) return false;
    const diffDays = (new Date() - d) / (1000*60*60*24);
    if(range === 'week') return diffDays <= 7;
    if(range === 'month') return diffDays <= 30;
    return true;
  }

  // بناء حقل قابل للتعديل (عرض نص + أيقونة تعديل/حذف، أو نموذج إدخال + زرار حفظ)
  function renderEditableField(fieldKey, value, opts){
    const hasValue = value !== null && value !== undefined && String(value).trim() !== '';
    const displayVal = hasValue ? (opts.formatDisplay ? opts.formatDisplay(value) : escapeHtml(value)) : '';
    const inputHtml = opts.type === 'textarea'
      ? `<textarea class="field-input" placeholder="${opts.placeholder}">${escapeHtml(value)}</textarea>`
      : `<input type="${opts.type||'text'}" class="field-input" placeholder="${opts.placeholder}" value="${hasValue ? escapeHtml(value) : ''}">`;
    return `
      <div class="note-box ${opts.extraClass||''}" data-field="${fieldKey}">
        <label>${opts.label}</label>
        <div class="field-display" style="${hasValue ? '' : 'display:none;'}">
          <span class="field-text">${displayVal}</span>
          <button class="icon-btn edit-field" type="button" title="تعديل">✏️</button>
          <button class="icon-btn delete-field" type="button" title="حذف">🗑️</button>
        </div>
        <div class="field-edit" style="${hasValue ? 'display:none;' : ''}">
          ${inputHtml}
          <button class="btn-save-note save-field" type="button">${opts.saveLabel}</button>
        </div>
      </div>
    `;
  }

  // تحديث كروت الإحصائيات
  function updateStats(){
    const todayStr = new Date().toDateString();
    const todayCount = allBookings.filter(b => b.created_at && new Date(b.created_at).toDateString() === todayStr).length;
    const newCount = allBookings.filter(b => !b.status || b.status === 'جديد').length;
    const ratedReviews = allReviews.filter(r => r.stars);
    const avgRating = ratedReviews.length
      ? (ratedReviews.reduce((s,r)=>s + Number(r.stars||0), 0) / ratedReviews.length).toFixed(1)
      : '–';
    const revenueRange = document.getElementById('revenueFilter')?.value || 'all';
    const revenue = allBookings
      .filter(b => inRevenueRange(b.created_at, revenueRange))
      .reduce((sum, b) => sum + (Number(b.price) || 0), 0);
    document.getElementById('statToday').textContent = todayCount;
    document.getElementById('statNew').textContent = newCount;
    document.getElementById('statAvgRating').textContent = avgRating;
    document.getElementById('statReviews').textContent = allReviews.length;
    document.getElementById('statRevenue').textContent = revenue.toLocaleString('ar-EG');
  }
  document.getElementById('revenueFilter').addEventListener('change', updateStats);

  // ---------- BOOKINGS ----------
  async function loadBookings(){
    const list = document.getElementById('bookingsList');
    const { data, error } = await supa.from('bookings').select('*').order('created_at', { ascending:false });
    if(error){
      list.innerHTML = '<div class="empty-state">تعذّر تحميل طلبات الحجز. تأكدي إنك عملتي جدول bookings والصلاحيات في Supabase.</div>';
      return;
    }
    allBookings = data || [];
    renderBookings();
    updateStats();
  }

  document.getElementById('exportExcelBtn').addEventListener('click', ()=>{
    const rows = filterBookings();
    if(rows.length === 0){ alert('مفيش حجوزات تتصدّر بالفلترة الحالية'); return; }
    const data = rows.map(b => ({
      'الاسم': b.name || '',
      'التليفون': b.phone || '',
      'العنوان': b.address || '',
      'النوع': b.gender || '',
      'اليوم المفضل': b.preferred_day || '',
      'نوع الحالة': b.case_type === '__other_option__' ? b.case_type_other : b.case_type,
      'مستوى الألم': b.pain_level || '',
      'الحالة': b.status || 'جديد',
      'السعر': b.price != null ? b.price : '',
      'ملاحظة': b.admin_note || '',
      'تاريخ الطلب': fmtDate(b.created_at)
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'الحجوزات');
    XLSX.writeFile(wb, `حجوزات-${new Date().toISOString().slice(0,10)}.xlsx`);
  });

  function renderBookings(){
    const list = document.getElementById('bookingsList');
    let rows = filterBookings();
    if(rows.length === 0){
      list.innerHTML = '<div class="empty-state">مفيش طلبات حجز مطابقة.</div>';
      return;
    }
    list.innerHTML = rows.map(b => {
      const waLink = toWhatsAppLink(b.phone);
      return `
      <div class="card" data-id="${b.id}">
        <div class="card-top">
          <div>
            <h3>${escapeHtml(b.name || 'بدون اسم')}</h3>
            <div class="meta">${fmtDate(b.created_at)}</div>
          </div>
          <span class="status-badge">${escapeHtml(b.status || 'جديد')}</span>
        </div>
        <div class="kv">
          <div><b>التليفون</b>${escapeHtml(b.phone)}</div>
          <div><b>العنوان</b>${escapeHtml(b.address)}</div>
          <div><b>النوع</b>${escapeHtml(b.gender)}</div>
          <div><b>اليوم المفضل</b>${escapeHtml(b.preferred_day)}</div>
          <div><b>نوع الحالة</b>${escapeHtml(b.case_type === '__other_option__' ? b.case_type_other : b.case_type)}</div>
          <div><b>مستوى الألم</b>${escapeHtml(b.pain_level)}</div>
          <div><b>بداية الأعراض</b>${escapeHtml(b.onset)}</div>
          <div><b>عمليات جراحية</b>${escapeHtml(b.surgery)}</div>
          <div><b>أدوية</b>${escapeHtml(b.meds)}</div>
          <div><b>حساسية</b>${escapeHtml(b.allergies)}</div>
          <div><b>أمراض مزمنة</b>${escapeHtml(b.chronic)}</div>
        </div>
        <div class="desc-box">${escapeHtml(b.description || 'لا يوجد وصف')}</div>
        ${renderEditableField('admin_note', b.admin_note, { label:'ملاحظة خاصة (مش هتظهر للمريض)', placeholder:'مثلاً: اتكلمت معاه، عايز يوم تاني', type:'textarea', saveLabel:'حفظ الملاحظة' })}
        ${renderEditableField('price', b.price, { label:'السعر', placeholder:'اكتبي السعر بالجنيه', type:'number', saveLabel:'حفظ السعر', extraClass:'price-box', formatDisplay:v=>escapeHtml(v)+' جنيه' })}
        <div class="card-actions">
          <select class="status-select">
            <option value="جديد" ${b.status==='جديد'?'selected':''}>جديد</option>
            <option value="تم التواصل" ${b.status==='تم التواصل'?'selected':''}>تم التواصل</option>
            <option value="تم الحجز" ${b.status==='تم الحجز'?'selected':''}>تم الحجز</option>
            <option value="ملغي" ${b.status==='ملغي'?'selected':''}>ملغي</option>
          </select>
          ${waLink ? `<a class="btn-whatsapp" href="${waLink}" target="_blank" rel="noopener">تواصل واتساب</a>` : ''}
          <button class="btn btn-danger delete-booking">حذف</button>
        </div>
      </div>
    `; }).join('');

    list.querySelectorAll('.card').forEach(card=>{
      const id = card.dataset.id;
      card.querySelector('.status-select').addEventListener('change', async (e)=>{
        const { error } = await supa.from('bookings').update({ status: e.target.value }).eq('id', id);
        if(error) alert('حصل خطأ في تحديث الحالة');
        else {
          const b = allBookings.find(x=>String(x.id)===String(id));
          if(b) b.status = e.target.value;
          updateStats();
        }
      });
      card.querySelectorAll('.note-box[data-field]').forEach(box=>{
        const field = box.dataset.field;
        const displayEl = box.querySelector('.field-display');
        const editEl = box.querySelector('.field-edit');
        const input = box.querySelector('.field-input');

        box.querySelector('.edit-field').addEventListener('click', ()=>{
          displayEl.style.display = 'none';
          editEl.style.display = '';
          input.focus();
        });

        box.querySelector('.delete-field').addEventListener('click', async ()=>{
          if(!confirm('متأكدة إنك عايزة تمسحي ده؟')) return;
          const { error } = await supa.from('bookings').update({ [field]: null }).eq('id', id);
          if(error){ alert('حصل خطأ في الحذف. تأكدي إن عمود ' + field + ' موجود في جدول bookings.'); return; }
          const b = allBookings.find(x=>String(x.id)===String(id));
          if(b) b[field] = null;
          renderBookings();
          if(field === 'price') updateStats();
        });

        box.querySelector('.save-field').addEventListener('click', async ()=>{
          const raw = input.value.trim();
          const val = field === 'price' ? (raw === '' ? null : Number(raw)) : (raw === '' ? null : raw);
          const { error } = await supa.from('bookings').update({ [field]: val }).eq('id', id);
          if(error){ alert('حصل خطأ في الحفظ. تأكدي إن عمود ' + field + ' موجود في جدول bookings.'); return; }
          const b = allBookings.find(x=>String(x.id)===String(id));
          if(b) b[field] = val;
          renderBookings();
          if(field === 'price') updateStats();
        });
      });
      card.querySelector('.delete-booking').addEventListener('click', async ()=>{
        if(!confirm('متأكدة إنك عايزة تمسحي طلب الحجز ده؟')) return;
        const { error } = await supa.from('bookings').delete().eq('id', id);
        if(error){ alert('حصل خطأ في الحذف'); return; }
        allBookings = allBookings.filter(x=>String(x.id)!==String(id));
        renderBookings();
        updateStats();
      });
    });
  }
  document.getElementById('bookingSearch').addEventListener('input', renderBookings);
  document.getElementById('statusFilter').addEventListener('change', renderBookings);
  document.getElementById('dateFilter').addEventListener('change', renderBookings);

  // ---------- REVIEWS ----------
  async function loadReviews(){
    const list = document.getElementById('reviewsList');
    const { data, error } = await supa.from('patient_reviews').select('*').order('ts', { ascending:false });
    if(error){
      list.innerHTML = '<div class="empty-state">تعذّر تحميل التعليقات.</div>';
      return;
    }
    allReviews = data || [];
    renderReviews();
    updateStats();
  }

  function renderReviews(){
    const list = document.getElementById('reviewsList');
    const q = document.getElementById('reviewSearch').value.trim().toLowerCase();
    const approvalQ = document.getElementById('reviewApprovalFilter').value;
    let rows = allReviews.filter(r=>{
      const matchQ = !q || (r.name||'').toLowerCase().includes(q) || (r.comment||'').toLowerCase().includes(q);
      const isApproved = r.approved === true;
      const matchApproval = !approvalQ || (approvalQ === 'approved' ? isApproved : !isApproved);
      return matchQ && matchApproval;
    });
    if(rows.length === 0){
      list.innerHTML = '<div class="empty-state">مفيش تعليقات مطابقة.</div>';
      return;
    }
    list.innerHTML = rows.map(r => `
      <div class="card" data-id="${r.id}">
        <div class="card-top">
          <div>
            <h3>${escapeHtml(r.name || 'زائر')}</h3>
            <div class="meta">${fmtDate(r.ts)} ${r.condition_type ? '· ' + escapeHtml(r.condition_type) : ''}</div>
          </div>
          <span class="status-badge ${r.approved ? '' : 'badge-pending'}">${r.approved ? 'منشور' : 'بانتظار المراجعة'}</span>
        </div>
        <div class="stars">${'★'.repeat(r.stars||5)}${'☆'.repeat(5-(r.stars||5))}</div>
        <div class="desc-box">${escapeHtml(r.comment || 'بدون تعليق مكتوب')}</div>
        <div class="card-actions">
          ${r.approved
            ? '<button class="btn btn-hide hide-review" type="button">🙈 إخفاء</button>'
            : '<button class="btn btn-approve approve-review" type="button">✔ موافقة ونشر</button>'}
          <button class="btn btn-danger delete-review">حذف التعليق</button>
        </div>
      </div>
    `).join('');

    list.querySelectorAll('.card').forEach(card=>{
      const id = card.dataset.id;
      card.querySelector('.approve-review')?.addEventListener('click', async ()=>{
        const { error } = await supa.from('patient_reviews').update({ approved: true }).eq('id', id);
        if(error){ alert('حصل خطأ في الموافقة. تأكدي إن عمود approved موجود في جدول patient_reviews.'); return; }
        const r = allReviews.find(x=>String(x.id)===String(id));
        if(r) r.approved = true;
        renderReviews();
      });
      card.querySelector('.hide-review')?.addEventListener('click', async ()=>{
        const { error } = await supa.from('patient_reviews').update({ approved: false }).eq('id', id);
        if(error){ alert('حصل خطأ في الإخفاء. تأكدي إن عمود approved موجود في جدول patient_reviews.'); return; }
        const r = allReviews.find(x=>String(x.id)===String(id));
        if(r) r.approved = false;
        renderReviews();
      });
      card.querySelector('.delete-review').addEventListener('click', async ()=>{
        if(!confirm('متأكدة إنك عايزة تمسحي التعليق ده؟')) return;
        const { error } = await supa.from('patient_reviews').delete().eq('id', id);
        if(error){ alert('حصل خطأ في الحذف'); return; }
        allReviews = allReviews.filter(x=>String(x.id)!==String(id));
        renderReviews();
        updateStats();
      });
    });
  }
  document.getElementById('reviewSearch').addEventListener('input', renderReviews);
  document.getElementById('reviewApprovalFilter').addEventListener('change', renderReviews);

  checkSession();
</script>
</body>
</html>
